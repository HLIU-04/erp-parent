<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>部门管理</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 20px;
            background: #f0f2f5;
        }
        .toolbar {
            margin-bottom: 20px;
        }
        .btn {
            background: #b22222;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        .btn-link {
            background: transparent;
            color: #b22222;
            border: 1px solid #b22222;
            margin: 0 4px;
            padding: 2px 8px;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background: #f5f5f5;
        }
        .error-msg {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div>
    <div class="toolbar">
        <button class="btn" id="addBtn">新增部门</button>
    </div>
    <div id="deptList">
        <table id="deptTable">
            <thead>
            <tr><th>ID</th><th>部门名称</th><th>状态</th><th>创建时间</th><th>操作</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    <div id="errorMsg" class="error-msg"></div>
</div>

<script>
    // API 基础路径（同源，无需额外配置）
    async function apiRequest(url, options = {}) {
        const token = localStorage.getItem('token');
        if (!token) {
            window.parent.location.href = '/login.html';  // 通知父窗口跳转登录
            throw new Error('未登录');
        }
        const res = await fetch(url, {
            ...options,
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`,
                ...options.headers
            }
        });
        if (res.status === 401) {
            localStorage.removeItem('token');
            window.parent.location.href = '/login.html';
            throw new Error('登录过期');
        }
        const data = await res.json();
        if (data.code !== 1) throw new Error(data.msg);
        return data.data;
    }

    // 加载部门列表
    async function loadDepts() {
        try {
            const data = await apiRequest('/admin/depts/page?pageNum=1&pageSize=100');
            const records = data.records;
            let html = '';
            records.forEach((dept, index) => {
                html += `<tr>
                         <td>${index + 1}</td>
                         <td>${dept.name}</td>
                         <td>${dept.status === 1 ? '启用' : '禁用'}</td>
                         <td>${dept.createTime || ''}</td>
                         <td>
                             <button class="btn-link" onclick="editDept(${dept.id}, '${dept.name}')">修改</button>
                             <button class="btn-link" onclick="deleteDept(${dept.id})">删除</button>
                         </td>
                    </table>`;
            });
            document.getElementById('tableBody').innerHTML = html;
        } catch (err) {
            document.getElementById('errorMsg').innerText = err.message;
        }
    }

    // 新增部门
    function addDept() {
        const name = prompt('请输入部门名称');
        if (!name) return;
        apiRequest('/admin/depts', {
            method: 'POST',
            body: JSON.stringify({ name, status: 1 })
        }).then(() => {
            loadDepts();
        }).catch(err => {
            document.getElementById('errorMsg').innerText = err.message;
        });
    }

    // 修改部门
    function editDept(id, oldName) {
        const newName = prompt('请输入新的部门名称', oldName);
        if (!newName) return;
        apiRequest('/admin/depts', {
            method: 'PUT',
            body: JSON.stringify({ id, name: newName })
        }).then(() => {
            loadDepts();
        }).catch(err => {
            document.getElementById('errorMsg').innerText = err.message;
        });
    }

    // 删除部门
    function deleteDept(id) {
        if (!confirm('确定删除该部门吗？')) return;
        apiRequest(`/admin/depts/${id}`, { method: 'DELETE' })
            .then(() => loadDepts())
            .catch(err => {
                document.getElementById('errorMsg').innerText = err.message;
            });
    }

    document.getElementById('addBtn').addEventListener('click', addDept);
    loadDepts();
</script>
</body>
</html>
