<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>刘记鸭ERP管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: #f0f2f5;
            height: 100vh;
            overflow: hidden;
        }

        /* 顶部栏 */
        .header {
            background: #b22222;
            color: white;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
        }
        .header-right {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .datetime, .username {
            font-size: 14px;
        }
        .logout-btn {
            background: transparent;
            border: 1px solid white;
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .logout-btn:hover {
            background: white;
            color: #b22222;
        }

        /* 主体布局 */
        .main-container {
            display: flex;
            height: calc(100vh - 60px);
        }

        /* 左侧菜单 */
        .sidebar {
            width: 220px;
            background: white;
            border-right: 1px solid #e8e8e8;
            overflow-y: auto;
        }
        .menu-item {
            padding: 14px 20px;
            cursor: pointer;
            border-left: 3px solid transparent;
            color: #333;
        }
        .menu-item:hover {
            background: #f5f5f5;
            color: #b22222;
        }
        .menu-item.active {
            background: #fef0f0;
            border-left-color: #b22222;
            color: #b22222;
            font-weight: 500;
        }

        /* 右侧内容区 */
        .content {
            flex: 1;
            overflow-y: auto;
            background: #f0f2f5;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .welcome-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>

<body>
<div class="header">
    <div class="logo">刘记鸭ERP管理系统</div>
    <div class="header-right">
        <div class="datetime" id="datetime"></div>
        <div class="username" id="username">加载中...</div>
        <button class="logout-btn" id="logoutBtn">退出登录</button>
    </div>
</div>
<div class="main-container">
    <div class="sidebar">
        <div class="menu-item active" data-page="welcome">工作台</div>
        <div class="menu-item" data-page="dept">部门管理</div>
        <div class="menu-item" data-page="employee">员工管理</div>
        <div class="menu-item" data-page="category">分类管理</div>
        <div class="menu-item" data-page="product">商品管理</div>
        <div class="menu-item" data-page="customer">客户管理</div>
        <div class="menu-item" data-page="order">订单管理</div>
        <div class="menu-item" data-page="daily">日报管理</div>
        <div class="menu-item" data-page="factoryDaily">日报登记</div>
        <div class="menu-item" data-page="statistics">统计报表</div>
    </div>
    <div class="content" id="content">
        <div class="welcome-card">
            <h2>欢迎使用刘记鸭ERP管理系统</h2>
            <p>请从左侧菜单选择功能</p>
        </div>
    </div>
</div>

<script>
    // API 请求函数（复用）
    async function apiRequest(url, options = {}) {
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login.html';
            throw new Error('未登录');
        }
        const res = await fetch(url, {
            ...options,
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`,
                ...options.headers
            }
        });
        if (res.status === 401) {
            localStorage.removeItem('token');
            window.location.href = '/login.html';
            throw new Error('登录过期');
        }
        const data = await res.json();
        if (data.code !== 1) throw new Error(data.msg);
        return data.data;
    }

    // 从 token 解析用户名和真实姓名
    function getUserInfo() {
        const token = localStorage.getItem('token');
        if (!token) return null;
        try {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const payload = JSON.parse(atob(base64));

            // 后端对 name 进行了 URL 编码，前端需要解码
            let name = payload.name;
            if (name) {
                try {
                    name = decodeURIComponent(name);
                } catch(e) { /* 解码失败则保留原值 */ }
            }

            return { username: payload.sub, role: payload.role, name: name || payload.sub };
        } catch(e) { return null; }
    }

    // 更新顶部栏（显示汉字姓名）
    function updateHeader() {
        const user = getUserInfo();
        document.getElementById('username').innerText = user ? user.name : '未知';
        function tick() {
            const now = new Date();
            const str = now.toLocaleString('zh-CN');
            document.getElementById('datetime').innerText = str;
        }
        tick();
        setInterval(tick, 1000);
    }

    // 菜单切换
    function loadPage(page) {
        const content = document.getElementById('content');
        if (page === 'welcome') {
            content.innerHTML = `<div class="welcome-card"><h2>欢迎使用刘记鸭ERP管理系统</h2><p>请从左侧菜单选择功能</p></div>`;
            content.style.padding = '20px';
        } else if (page === 'dept') {
            content.innerHTML = `<iframe src="/dept.html" style="width:100%; height:100%; border:none;"></iframe>`;
            content.style.padding = '0';
            content.style.overflow = 'hidden';
        } else if (page === 'product') {
            content.innerHTML = `<iframe src="/product.html" style="width:100%; height:100%; border:none;"></iframe>`;
            content.style.padding = '0';
            content.style.overflow = 'hidden';
        } else if (page === 'customer') {
            content.innerHTML = `<iframe src="/customer.html" style="width:100%; height:100%; border:none;"></iframe>`;
            content.style.padding = '0';
            content.style.overflow = 'hidden';
        } else if (page === 'order') {
            content.innerHTML = `<iframe src="/order.html" style="width:100%; height:100%; border:none;"></iframe>`;
            content.style.padding = '0';
            content.style.overflow = 'hidden';
        } else if (page === 'daily') {
            content.innerHTML = `<iframe src="/daily-report.html" style="width:100%; height:100%; border:none;"></iframe>`;
            content.style.padding = '0';
            content.style.overflow = 'hidden';
        } else if (page === 'employee') {
            const timestamp = new Date().getTime();
            content.innerHTML = `<iframe src="/employee.html?t=${timestamp}" style="width:100%; height:100%; border:none;"></iframe>`;
            content.style.padding = '0';
            content.style.overflow = 'hidden';
        } else if (page === 'statistics') {
            content.innerHTML = `<iframe src="/statistics.html" style="width:100%; height:100%; border:none;"></iframe>`;
            content.style.padding = '0';
            content.style.overflow = 'hidden';
        } else if(page === 'category') {
            content.innerHTML = `<iframe src="/category.html" style="width:100%; height:100%; border:none;"></iframe>`;
            content.style.padding = '0';
            content.style.overflow = 'hidden';
        }else if (page === 'factoryDaily') {
            content.innerHTML = `<iframe src="/factory-daily.html" style="width:100%; height:100%; border:none;"></iframe>`;
            content.style.padding = '0';
            content.style.overflow = 'hidden';
        }
        // 高亮当前菜单
        document.querySelectorAll('.menu-item').forEach(item => {
            if (item.dataset.page === page) item.classList.add('active');
            else item.classList.remove('active');
        });
    }

    // 退出登录
    function logout() {
        localStorage.removeItem('token');
        window.location.href = '/login.html';
    }

    // 初始化
    function init() {
        if (!localStorage.getItem('token')) {
            window.location.href = '/login.html';
            return;
        }
        updateHeader();
        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', () => loadPage(item.dataset.page));
        });
        document.getElementById('logoutBtn').addEventListener('click', logout);
        loadPage('welcome');
    }
    init();
</script>
</body>
</html>
