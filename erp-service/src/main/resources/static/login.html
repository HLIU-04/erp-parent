<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刘记鸭ERP管理系统 - 登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: linear-gradient(to top, #8b0000, #ffcccc); /* 由下到上的红色渐变 */
            font-family: 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 登录框容器 */
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 400px;
            padding: 40px 30px;
            backdrop-filter: blur(2px);
        }

        .login-container h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
            color: #a52a2a;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
            box-sizing: border-box;
        }

        .input-group input:focus {
            border-color: #b22222;
            outline: none;
            box-shadow: 0 0 5px rgba(178, 34, 34, 0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #b22222;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #8b0000;
        }

        .error-msg {
            color: #d9534f;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            min-height: 40px;
        }

        /* 简单响应式 */
        @media (max-width: 480px) {
            .login-container {
                width: 90%;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
<div class="login-container">
    <h1>刘记鸭ERP管理系统</h1>
    <form id="loginForm">
        <div class="input-group">
            <label>用户名</label>
            <input type="text" id="username" placeholder="请输入用户名" autocomplete="off">
        </div>
        <div class="input-group">
            <label>密码</label>
            <input type="password" id="password" placeholder="请输入密码">
        </div>
        <button type="button" id="loginBtn">登 录</button>
        <div class="error-msg" id="errorMsg"></div>
    </form>
</div>

<script>
    // 获取元素
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const errorMsgDiv = document.getElementById('errorMsg');

    // 登录逻辑
    async function login() {
        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();

        if (!username || !password) {
            errorMsgDiv.innerText = '用户名和密码不能为空';
            return;
        }

        errorMsgDiv.innerText = ''; // 清空旧错误

        try {
            const response = await fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password })
            });

            const result = await response.json();

            if (result.code === 1) {
                // 登录成功，存储 token
                localStorage.setItem('token', result.data);
                // 跳转到主页 index.html
                window.location.href = '/index.html';
            } else {
                errorMsgDiv.innerText = result.msg || '登录失败，请检查用户名或密码';
            }
        } catch (error) {
            console.error('登录请求异常:', error);
            errorMsgDiv.innerText = '网络异常，请稍后再试';
        }
    }

    // 绑定点击事件
    loginBtn.addEventListener('click', login);

    // 支持回车键提交
    const inputs = [usernameInput, passwordInput];
    inputs.forEach(input => {
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });
    });
</script>
</body>
</html>
